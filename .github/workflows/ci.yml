name: CI

on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run Ruff linter
        run: uv run ruff check src tests

      - name: Run Pyright strict type check
        run: uv run pyright

      - name: Run Pytest with coverage
        run: uv run pytest --cov=findex --cov-report=term-missing