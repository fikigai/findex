[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "findex"
version = "1.0.0"
description = "Fast vectorized NumPy BM25/TF-IDF, Semantic & Hybrid (RRF) search engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "jinja2>=3.1.4",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=3.0.0",
]

[project.scripts]
findex = "findex.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.100.0",
    "pyright>=1.1.380",
    "ruff>=0.6.0",
    "psutil>=6.0.0",
    "matplotlib>=3.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/findex"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportUnknownMemberType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"